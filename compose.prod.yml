# Un solo proyecto Compose conserva los nombres originales de los volúmenes.
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"
x-app: &app
  logging: *logging
  image: ${BLUE_IMAGE:-${APP_IMAGE:-app:unconfigured}}
  restart: unless-stopped
  env_file: .env
  environment:
    HOSTNAME: 0.0.0.0
    PORT: 3000
  volumes:
    - ./private:/app/private
  stop_grace_period: 60s
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready',{signal:AbortSignal.timeout(12000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 15s
    retries: 24
    start_period: 20s
services:
  blue:
    <<: *app
  green:
    <<: *app
    image: ${GREEN_IMAGE:-${APP_IMAGE:-app:unconfigured}}
  nginx:
    logging: *logging
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./docker/www/production/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.deploy/nginx:/etc/nginx/conf.d:ro
      - ./.deploy/assets:/srv/assets:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/html:ro
    stop_grace_period: 60s
  db:
    logging: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - ./docker/database/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - dbdata:/var/lib/postgresql/data
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 24
volumes:
  dbdata:
  certbot-etc:
  certbot-webroot:
